name: server
# Tests the Firestore rules and server functions on the Firebase emulators, then deploys them
# (rules + functions) to the pip-sky-islands project. Deploying signs in to Google Cloud with
# Workload Identity Federation: no keys are stored in GitHub. tools/setup-server.sh sets it up once.
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'firebase.json', 'tests/server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['functions/**', 'firestore.rules', 'tests/server/**']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: tests/server/run.sh
      - name: Email domain records (information only)
        run: |
          for n in resend._domainkey send; do echo "::notice title=DNS $n::TXT=$(dig +short TXT $n.pipskyislands.com | tr '\n' ' ') MX=$(dig +short MX $n.pipskyislands.com | tr '\n' ' ')"; done
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/911404168229/locations/global/workloadIdentityPools/github/providers/github
          service_account: pip-deployer@pip-sky-islands.iam.gserviceaccount.com
      - name: Not set up yet
        if: steps.auth.outcome != 'success'
        run: echo "::notice::Deploy skipped - run tools/setup-server.sh in Google Cloud Shell once to allow deploys from GitHub."
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.auth.outcome == 'success'
      - name: Prepare the project (APIs and the functions' own permissions)
        if: steps.auth.outcome == 'success'
        run: tools/prepare-project.sh
      - name: Deploy rules and functions
        if: steps.auth.outcome == 'success'
        run: |
          (cd functions && npm install --no-audit --no-fund --silent)
          set +e
          npx --yes firebase-tools@14 deploy --only firestore:rules,functions --project pip-sky-islands --force --non-interactive 2>&1 | tee deploy.log
          rc=${PIPESTATUS[0]}
          # show the end of the log as one annotation (readable from `gh run view`)
          msg=$(sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -vE '^\s*$|required API|ensuring|is enabled' | tail -14 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ $rc -ne 0 ]; then echo "::error title=deploy::$msg"; [ -f firebase-debug.log ] && echo "::error title=debug::$(grep -iE 'error|denied|permission' firebase-debug.log | tail -15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit $rc; fi
          echo "::notice title=deploy::$msg"

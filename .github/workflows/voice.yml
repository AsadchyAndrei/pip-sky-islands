name: voice
# Pip's voice with Google Cloud Text-to-Speech: samples to choose a voice (run by hand).
on:
  workflow_dispatch:
    inputs:
      voices:
        description: 'Chirp 3 HD voice names, separated by spaces'
        default: 'Puck Fenrir Leda Zephyr'
permissions:
  contents: write
  id-token: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/911404168229/locations/global/workloadIdentityPools/github/providers/github
          service_account: pip-deployer@pip-sky-islands.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: tools/voice/samples.sh
        env:
          VOICES: ${{ github.event.inputs.voices }}
      - name: Keep the samples on the voice-samples branch (not on the site)
        run: |
          cp -r out /tmp/out && git config user.name 'voice bot' && git config user.email 'noreply@anthropic.com'
          git checkout --orphan voice-samples && git rm -rfq . && cp /tmp/out/* . && git add -A && git commit -qm "Voice samples" && git push -fq origin voice-samples

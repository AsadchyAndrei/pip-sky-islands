name: voice
# Pip's voice with Google Cloud Text-to-Speech: samples to choose a voice (run by hand).
on:
  workflow_dispatch:
    inputs:
      voices:
        description: 'Chirp 3 HD voice names separated by spaces (samples), "pack" (Pip''s everyday lines from voice/lines.txt), or "-" (delete the branch)'
        default: 'Puck Fenrir Leda Zephyr'
permissions:
  contents: write
  id-token: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/911404168229/locations/global/workloadIdentityPools/github/providers/github
          service_account: pip-deployer@pip-sky-islands.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check the live voice server (voices=check)
        if: github.event.inputs.voices == 'check'
        run: |
          for i in 1 2; do s=$(date +%s%N); r=$(curl -sS -o /tmp/q.mp3 -w '%{http_code} %{content_type} %{size_download}' 'https://us-central1-pip-sky-islands.cloudfunctions.net/tts?t=What%20is%207%20times%208%3F'); echo "::notice title=tts try $i::$r in $(( ($(date +%s%N)-s)/1000000 )) ms"; done
          case "$r" in 200*) exit 0;; *) exit 1;; esac
      - run: tools/voice/pack.sh
        if: github.event.inputs.voices == 'pack'
      - run: tools/voice/samples.sh
        if: github.event.inputs.voices != '-' && github.event.inputs.voices != 'pack' && github.event.inputs.voices != 'check'
        env:
          VOICES: ${{ github.event.inputs.voices }}
      - name: Keep only the MP3s and the voice list on the voice-samples branch (not on the site); "-" just deletes the branch
        if: github.event.inputs.voices != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'voice bot' && git config --global user.email 'noreply@anthropic.com'
          git push -q origin --delete voice-samples || true
          [ "${{ github.event.inputs.voices }}" = "-" ] && exit 0
          D=$(mktemp -d) && cp out/*.mp3 "$D"/ && cp out/*.txt out/*.json "$D"/ 2>/dev/null || true; cd "$D"
          git init -q -b voice-samples && git add -- *.mp3 $(ls *.txt *.json 2>/dev/null) && git commit -qm "Voice samples"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" voice-samples
